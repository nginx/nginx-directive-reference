name: reference-lib CI

on:
  pull_request:
    branches: ['main']
    paths: ['reference-lib/**', '.github/workflows/reference-lib.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: ./reference-lib
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test
      - run: npm run build
